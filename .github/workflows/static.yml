name: Static validation

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  validate-static-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required project files exist
        run: |
          test -f index.html
          test -f app.js
          test -f server.js
          test -f package.json
