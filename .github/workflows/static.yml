                <span class="badge-dot" style="background:#06b6d4; width:7px; height:7px; border-radius:50%;"></span>
                EXTERNAL API &bull; Secure Layer
              </span>
              <h3 class="pipeline-title">Third-Party Cloud APIs</h3>
              <p class="pipeline-desc">
                Used only for resource-heavy workloads that cannot reasonably execute client-side. Transparently marked with external processing notices.
              </p>

              <div class="flow-chain">
                <div class="flow-step"><i class="fa-solid fa-user-check" style="color:var(--accent-amber);"></i> 1. Explicit User Action &amp; Notice</div>
                <div class="flow-step"><i class="fa-solid fa-shield" style="color:var(--primary);"></i> 2. Secure EasyTool API Gateway (Server-Side Keys)</div>
                <div class="flow-step"><i class="fa-solid fa-cloud" style="color:var(--accent-cyan);"></i> 3. Google Gemini API / Background.bg API</div>
                <div class="flow-step step-clean"><i class="fa-solid fa-download" style="color:var(--accent-emerald);"></i> 4. Result Returned &bull; Zero Server Retention</div>
              </div>

