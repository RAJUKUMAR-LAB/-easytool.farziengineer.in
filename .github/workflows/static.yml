          <div class="principles-grid">
            <!-- Principle 1 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(99,102,241,0.15); color:var(--primary);">
                <i class="fa-solid fa-code-branch"></i>
              </div>
              <h3 class="principle-title">1. Free &amp; Open Source</h3>
              <p class="principle-desc">
                No paywalls, no hidden costs, and no mandatory subscriptions for utilities. Built with open-source technologies and respectful attribution.
              </p>
            </div>

            <!-- Principle 2 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(16,185,129,0.15); color:var(--accent-emerald);">
                <i class="fa-solid fa-laptop-code"></i>
              </div>
              <h3 class="principle-title">2. Local-First Processing</h3>
              <p class="principle-desc">
                Whenever technically possible, your files remain strictly inside your browser. Computation executes via WebAssembly, Web Crypto, and Canvas.
              </p>
            </div>

            <!-- Principle 3 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(6,182,212,0.15); color:var(--accent-cyan);">
                <i class="fa-solid fa-user-slash"></i>
              </div>
              <h3 class="principle-title">3. No Accounts Required</h3>
              <p class="principle-desc">
                No login, signup, personal profiles, or email verification required. Open EasyTool and immediately access every tool without friction.
              </p>
            </div>

            <!-- Principle 4 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(244,63,94,0.15); color:var(--accent-rose);">
                <i class="fa-solid fa-database"></i>
              </div>
              <h3 class="principle-title">4. Zero File Storage</h3>
              <p class="principle-desc">
                No user database, cloud buckets, or upload history. Files follow: Select &rarr; Validate &rarr; Process &rarr; Result &rarr; Download &rarr; Instant Cleanup.
              </p>
            </div>

            <!-- Principle 5 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(245,158,11,0.15); color:var(--accent-amber);">
                <i class="fa-solid fa-circle-check"></i>
              </div>
              <h3 class="principle-title">5. No Fake Tools</h3>
              <p class="principle-desc">
                Every utility works genuinely. No fake progress bars, fake download buttons, or fabricated AI results. If a tool isn't ready, we disclose it honestly.
              </p>
            </div>

            <!-- Principle 6 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(168,85,247,0.15); color:var(--accent-purple);">
                <i class="fa-solid fa-cloud-arrow-up"></i>
              </div>
              <h3 class="principle-title">6. API Transparency</h3>
              <p class="principle-desc">
                Clear badges for every tool: <strong>LOCAL</strong> for browser-only, <strong>AI</strong> or <strong>EXTERNAL API</strong> for Google Gemini and Background Removal tools.
              </p>
            </div>

            <!-- Principle 7 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(20,184,166,0.15); color:#14b8a6;">
                <i class="fa-solid fa-shield-halved"></i>
              </div>
              <h3 class="principle-title">7. Zero Tracking &amp; Ads</h3>
              <p class="principle-desc">
                No invasive ad networks, user profiling, or tracker scripts. Your online activity stays unmonitored, ad-free, and completely private.
              </p>
            </div>

            <!-- Principle 8 -->
            <div class="principle-card">
              <div class="principle-icon-wrap" style="background:rgba(236,72,153,0.15); color:#ec4899;">
                <i class="fa-solid fa-bolt-lightning"></i>
              </div>
              <h3 class="principle-title">8. Offline PWA Capable</h3>
              <p class="principle-desc">
                Install directly as a progressive web app on your phone or PC. High-speed client-side execution with reliable offline capabilities.
              </p>
            </div>
