        <!-- 3. ARCHITECTURE & DISCLOSURE -->
        <section class="architecture-container" id="architecture">
          <div style="text-align:center; max-width:720px; margin:0 auto;">
            <div class="section-pill-tag" style="background:rgba(6,182,212,0.15); color:var(--accent-cyan); border:1px solid rgba(6,182,212,0.3);">
              <i class="fa-solid fa-diagram-project"></i> Architecture Showcase
            </div>
            <h2 style="font-size:2.2rem; font-weight:800; color:#fff; letter-spacing:-0.03em; margin-bottom:0.5rem;">
              Transparent Processing Architecture
            </h2>
            <p style="color:var(--text-secondary); font-size:0.95rem; line-height:1.6;">
              "EasyTool processes files locally in your browser whenever technically possible. Some advanced features, including selected AI and background-removal tools, may use third-party APIs."
            </p>
          </div>

          <div class="dual-pipeline-grid">
            <!-- Stream 1: Local Processing -->
            <div class="pipeline-card" style="border-left:3px solid var(--accent-emerald);">
              <span class="pipeline-badge local">
                <span class="badge-dot" style="background:#10b981; width:7px; height:7px; border-radius:50%;"></span>
                LOCAL PROCESSING &bull; In-Browser
              </span>
              <h3 class="pipeline-title">Client-Side Local Engine</h3>
              <p class="pipeline-desc">
                Runs entirely inside your browser's sandboxed thread. Zero data packet containing your file is transmitted across the internet.
              </p>
              
              <div class="flow-chain">
                <div class="flow-step"><i class="fa-solid fa-file-arrow-up" style="color:var(--accent-cyan);"></i> 1. User Selects File (RAM Memory only)</div>
                <div class="flow-step"><i class="fa-solid fa-gears" style="color:var(--accent-purple);"></i> 2. WebAssembly / Web Workers Engine</div>
                <div class="flow-step"><i class="fa-solid fa-file-export" style="color:var(--accent-emerald);"></i> 3. Immediate In-Memory Download</div>
                <div class="flow-step step-clean"><i class="fa-solid fa-broom" style="color:var(--accent-emerald);"></i> 4. Object URLs Revoked &amp; RAM Cleared</div>
              </div>

              <div style="font-size:0.8rem; color:var(--text-muted); font-family:var(--font-mono);">
                Powered by: PDF.js &bull; PDF-Lib &bull; Pyodide WASM &bull; Canvas API &bull; Web Crypto
              </div>
            </div>

